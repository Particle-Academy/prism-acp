name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 9 * * *'

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }}, PHP ${{ matrix.php }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: ['8.2', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fetch org dependency policy
        uses: actions/checkout@v4
        with:
          repository: Particle-Academy/.github
          path: .third-party-allowlist
          persist-credentials: false
      - name: Check org dependency policy before install
        run: node .third-party-allowlist/third-party/check.mjs --repo .
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          coverage: none
          tools: composer:v2
      - name: Resolve current compatible dependencies
        run: composer update --prefer-dist --no-interaction --no-progress
      - run: composer validate --strict
      - run: composer audit
      - run: composer test -- --compact
      - name: Consumer installation without development dependencies
        shell: bash
        run: |
          export ACP_CONSUMER_DIR="${RUNNER_TEMP}/acp-consumer"
          mkdir -p "$ACP_CONSUMER_DIR"
          php -r '$root = str_replace("\\", "/", getcwd()); file_put_contents(getenv("ACP_CONSUMER_DIR")."/composer.json", json_encode(["require" => ["particle-academy/prism-acp" => "*@dev"], "repositories" => [["type" => "path", "url" => $root, "options" => ["symlink" => false]]], "config" => ["allow-plugins" => false]], JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES));'
          composer install --working-dir="$ACP_CONSUMER_DIR" --no-dev --no-scripts --no-plugins --prefer-dist --no-interaction
          php scripts/consumer-smoke.php "$ACP_CONSUMER_DIR/vendor/autoload.php"

  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch org dependency policy
        uses: actions/checkout@v4
        with:
          repository: Particle-Academy/.github
          path: .third-party-allowlist
          persist-credentials: false
      - name: Check org dependency policy before install
        run: node .third-party-allowlist/third-party/check.mjs --repo .
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring
          coverage: none
          tools: composer:v2, composer-require-checker:4.17.0
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: composer types
      - run: php vendor/bin/pint --test
      - run: composer rector
      - run: composer-require-checker check composer.json
      - run: php -l bin/prism-acp
      - run: php bin/prism-acp --version
      - run: git diff --exit-code

  reference:
    name: Published TypeScript reference
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fetch fixtures at the published reference's source
        uses: actions/checkout@v4
        with:
          repository: Particle-Academy/prism-acp-ts
          ref: d78555a4884e60ad1d8766eead8f2a7f40eb3eb7
          path: .reference-source
          persist-credentials: false
      - name: Fetch org dependency policy
        uses: actions/checkout@v4
        with:
          repository: Particle-Academy/.github
          path: .third-party-allowlist
          persist-credentials: false
      - name: Check org dependency policy before install
        run: node .third-party-allowlist/third-party/check.mjs --repo .
      - name: Install published reference without lifecycle scripts
        run: npm install --prefix .reference-runtime --ignore-scripts --no-audit --no-fund --no-package-lock @particle-academy/prism-acp@0.25.1
      - name: Regenerate expectations using the actual published code
        run: |
          node tools/golden/claude-to-acp.mjs .reference-runtime/node_modules/@particle-academy/prism-acp .reference-source/test/fixtures
          node tools/golden/units.mjs .reference-runtime/node_modules/@particle-academy/prism-acp
          node tools/golden/agent.mjs .reference-runtime/node_modules/@particle-academy/prism-acp
          node tools/golden/codex-driver.mjs .reference-runtime/node_modules/@particle-academy/prism-acp
          node tools/golden/credentials.mjs .reference-runtime/node_modules/@particle-academy/prism-acp
          node tools/golden/redact.mjs .reference-runtime/node_modules/@particle-academy/prism-acp
          git diff --exit-code -- tests/fixtures
          test -z "$(git ls-files --others --exclude-standard -- tests/fixtures)"
      - name: Report newer reference releases
        run: |
          node --test scripts/reference-review.test.mjs
          node scripts/reference-currency.mjs

  native-approval:
    name: Native Claude approval (Windows, PHP 8.4)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/checkout@v4
        with:
          repository: Particle-Academy/.github
          path: .third-party-allowlist
          persist-credentials: false
      - run: node .third-party-allowlist/third-party/check.mjs --repo .
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring
          coverage: none
          tools: composer:v2
      - run: composer update --no-scripts --prefer-dist --no-interaction --no-progress
      - name: Native executable only; no lifecycle scripts, real login or model traffic
        run: npm install --prefix .native-cli --ignore-scripts --no-package-lock @anthropic-ai/claude-code-win32-x64@2.1.310
      - name: Actual native approval and version controls
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .approval-evidence -Force | Out-Null
          php vendor/bin/pest tests/Native/ClaudeApprovalTest.php --compact > .approval-evidence/native.log 2>&1
          $gateExit = $LASTEXITCODE
          Get-Content .approval-evidence/native.log
          exit $gateExit
        env:
          PRISM_ACP_CLAUDE_APPROVAL: '1'
          PRISM_ACP_CLAUDE_BINARY: ${{ github.workspace }}/.native-cli/node_modules/@anthropic-ai/claude-code-win32-x64/claude.exe
      - name: Preserve native receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: php-native-approval
          path: .approval-evidence/
          include-hidden-files: true
          if-no-files-found: error

  supervisor-cold-cache:
    name: Parallel cold installs (Windows, PHP 8.4)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/checkout@v4
        with:
          repository: Particle-Academy/.github
          path: .third-party-allowlist
          persist-credentials: false
      - run: node .third-party-allowlist/third-party/check.mjs --repo .
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring
          coverage: none
          tools: composer:v2
      - run: composer update --no-scripts --prefer-dist --no-interaction --no-progress
      - name: Reject missing or inconsistent compiler-generation evidence
        run: node --test scripts/cold-cache-receipts.test.mjs
      - name: Released publisher must fail the same 20x8 provider and approval oracle
        run: node scripts/check-supervisor-cold-cache.mjs (php -r 'echo PHP_BINARY;')
      - name: Preserve cold-cache receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: php-supervisor-cold-cache
          path: .approval-evidence/
          include-hidden-files: true
          if-no-files-found: error

  fpm-sapi:
    name: Actual FPM runtime selection (Ubuntu 24.04, PHP 8.3)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/checkout@v4
        with:
          repository: Particle-Academy/.github
          path: .third-party-allowlist
          persist-credentials: false
      - run: node .third-party-allowlist/third-party/check.mjs --repo .
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring
          coverage: none
          tools: composer:v2
      - run: composer update --no-scripts --prefer-dist --no-interaction --no-progress
      - name: Extract the distribution's FPM executable without installing a system service
        run: |
          sudo apt-get update
          mkdir .fpm-runtime
          cd .fpm-runtime
          apt-get download php8.3-fpm
          dpkg-deb -x ./*.deb image
      - name: Private Unix socket, one owned FPM pool, no web server or provider launch
        run: |
          mkdir .approval-evidence
          node scripts/check-fpm-sapi.mjs .fpm-runtime/image/usr/sbin/php-fpm8.3 .approval-evidence/fpm.json
      - name: Preserve FPM measurement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: php-fpm-sapi
          path: .approval-evidence/
          include-hidden-files: true
          if-no-files-found: error
