              got = crypto.createHash("sha256").update(lf, "latin1").digest("hex");
            } catch {}
            if (got !== hash) fail.push(file + " sha256 is " + got + ", pinned " + hash);
          }
          for (const f of fail) console.log("::error::Pinned checkout mismatch: " + f);
          if (fail.length) {
            console.log("::error::Refusing to run fetched code that does not match its pin. Review the upstream change, then re-pin with pin-github-checks.mjs.");
            process.exit(1);
          }
          console.log("Pinned checkout verified: " + head + ", " + want.length + " files match.");
          '
      - run: node .third-party-allowlist/third-party/check.mjs --repo .
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring
          coverage: none
          tools: composer:v2
      - run: composer update --no-scripts --prefer-dist --no-interaction --no-progress
      - name: Extract the distribution's FPM executable without installing a system service
        run: |
          sudo apt-get update
          mkdir .fpm-runtime
          cd .fpm-runtime
          apt-get download php8.3-fpm
          dpkg-deb -x ./*.deb image
      - name: Private Unix socket, one owned FPM pool, no web server or provider launch
        run: |
          mkdir .approval-evidence
          node scripts/check-fpm-sapi.mjs .fpm-runtime/image/usr/sbin/php-fpm8.3 .approval-evidence/fpm.json
      - name: Preserve FPM measurement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: php-fpm-sapi
          path: .approval-evidence/
          include-hidden-files: true
          if-no-files-found: error
