          extensions: mbstring
          coverage: none
          tools: composer:v2
      - run: composer update --no-scripts --prefer-dist --no-interaction --no-progress
      - name: Native executable only; no lifecycle scripts, real login or model traffic
        run: npm install --prefix .native-cli --ignore-scripts --no-package-lock @anthropic-ai/claude-code-win32-x64@2.1.310
      - name: Actual native approval and version controls
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .approval-evidence -Force | Out-Null
          php vendor/bin/pest tests/Native/ClaudeApprovalTest.php --compact > .approval-evidence/native.log 2>&1
          $gateExit = $LASTEXITCODE
          Get-Content .approval-evidence/native.log
          exit $gateExit
        env:
          PRISM_ACP_CLAUDE_APPROVAL: '1'
          PRISM_ACP_CLAUDE_BINARY: ${{ github.workspace }}/.native-cli/node_modules/@anthropic-ai/claude-code-win32-x64/claude.exe
