name: G-383 diagnostic
on:
  pull_request:
permissions:
  contents: read
jobs:
  diag:
    name: diag (${{ matrix.attempt }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring
          coverage: none
          tools: composer:v2
      - run: composer update --prefer-dist --no-interaction --no-progress
      - name: matrix
        run: |
          set +e
          for mutant in 0 1; do
            G383_MUTANT=$mutant vendor/bin/pest tests/Unit/CredentialDescendantProtectionTest.php --filter 'descendant symlink' >/dev/null 2>&1; echo "RESULT new-test mutant=$mutant exit=$?"
            G383_MUTANT=$mutant vendor/bin/pest tests/Diagnostic/OriginalSymlinkTest.php --filter 'ORIGINAL' >/dev/null 2>&1; echo "RESULT old-test mutant=$mutant exit=$?"
          done
          G383_MUTANT=1 vendor/bin/pest tests/Unit/CredentialDescendantProtectionTest.php --filter 'descendant symlink' 2>&1 | grep -iE "atime|Failed asserting" | head -5 || true
